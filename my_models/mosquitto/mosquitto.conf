# ================================================================
# Mosquitto MQTT Broker — SMIA deployment (Vicomtech DII)
# Internal Docker service name: mosquitto-central
# ================================================================
# All SMIA machine agents and Node-RED communicate through this
# broker on port 1883 using the internal Docker network (smia-net).
# The bridge in conf.d/bridge.conf forwards relevant topics to the
# physical machine's own MQTT broker.

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type all

# Load bridge configuration
include_dir /etc/mosquitto/conf.d
